name: Supply chain security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-images:
    name: Build, attest and scan production images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enforce container and workflow hardening policy
        run: python3 scripts/verify_container_security.py

      - name: Validate Compose syntax without resolving deployment secrets
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.test.yml config --quiet
          docker compose -f docker-compose.e2e.yml config --quiet
          docker compose -f docker-compose.backup-restore.verify.yml config --quiet
          docker compose -f docker-compose.prod.yml -f deployment/caddy/docker-compose.caddy.yml config --no-interpolate --quiet

      - name: Build reproducible production backend image
        run: docker build --pull=false --tag practiceflow-backend:${{ github.sha }} backend

      - name: Build reproducible production frontend image
        run: docker build --pull=false --tag practiceflow-frontend:${{ github.sha }} frontend

      - name: Create artifact directories
        run: mkdir -p artifacts/sbom artifacts/trivy

      - name: Generate backend SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: practiceflow-backend:${{ github.sha }}
          format: spdx-json
          syft-version: v1.51.1
          output-file: artifacts/sbom/practiceflow-backend.spdx.json
          upload-artifact: "false"

      - name: Generate frontend SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: practiceflow-frontend:${{ github.sha }}
          format: spdx-json
          syft-version: v1.51.1
          output-file: artifacts/sbom/practiceflow-frontend.spdx.json
          upload-artifact: "false"

      - name: Install checksum-pinned Trivy release
        run: |
          curl --fail --location --retry 3 \
            https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz \
            --output "$RUNNER_TEMP/trivy.tar.gz"
          echo "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/trivy"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/trivy" trivy
          "$RUNNER_TEMP/trivy/trivy" --version

      - name: Scan backend image for High and Critical CVEs
        id: trivy_backend
        continue-on-error: true
        run: >-
          "$RUNNER_TEMP/trivy/trivy" image
          --format json --output artifacts/trivy/practiceflow-backend.json
          --severity HIGH,CRITICAL --exit-code 1 --scanners vuln
          --ignore-unfixed=false --ignorefile .trivyignore --no-progress
          practiceflow-backend:${{ github.sha }}

      - name: Scan frontend image for High and Critical CVEs
        id: trivy_frontend
        continue-on-error: true
        run: >-
          "$RUNNER_TEMP/trivy/trivy" image
          --format json --output artifacts/trivy/practiceflow-frontend.json
          --severity HIGH,CRITICAL --exit-code 1 --scanners vuln
          --ignore-unfixed=false --ignorefile .trivyignore --no-progress
          practiceflow-frontend:${{ github.sha }}

      - name: Upload SBOM and vulnerability scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-image-supply-chain-artifacts
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/sbom
            artifacts/trivy

      - name: Enforce High/Critical CVE gate
        if: always()
        env:
          BACKEND_SCAN: ${{ steps.trivy_backend.outcome }}
          FRONTEND_SCAN: ${{ steps.trivy_frontend.outcome }}
        run: |
          if [ "$BACKEND_SCAN" != "success" ] || [ "$FRONTEND_SCAN" != "success" ]; then
            echo "Both vulnerability scans must succeed; see the uploaded Trivy reports."
            exit 1
          fi
          test -s artifacts/trivy/practiceflow-backend.json
          test -s artifacts/trivy/practiceflow-frontend.json
