name: Supply chain security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-images:
    name: Build, attest and scan production images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Enforce container and workflow hardening policy
        run: python3 scripts/verify_container_security.py

      - name: Validate Compose syntax without resolving deployment secrets
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.test.yml config --quiet
          docker compose -f docker-compose.e2e.yml config --quiet
          docker compose -f docker-compose.backup-restore.verify.yml config --quiet
          docker compose -f docker-compose.prod.yml -f deployment/caddy/docker-compose.caddy.yml config --no-interpolate --quiet

      - name: Build reproducible production backend image
        run: docker build --pull=false --tag practiceflow-backend:${{ github.sha }} backend

      - name: Build reproducible production frontend image
        run: docker build --pull=false --tag practiceflow-frontend:${{ github.sha }} frontend

      - name: Create artifact directories
        run: mkdir -p artifacts/sbom artifacts/trivy

      - name: Generate backend SPDX SBOM
        uses: anchore/sbom-action@8e94d75ddd33f69f691467e42275782e4bfefe84 # v0.20.9
        with:
          image: practiceflow-backend:${{ github.sha }}
          format: spdx-json
          syft-version: v1.51.1
          output-file: artifacts/sbom/practiceflow-backend.spdx.json
          upload-artifact: "false"

      - name: Generate frontend SPDX SBOM
        uses: anchore/sbom-action@8e94d75ddd33f69f691467e42275782e4bfefe84 # v0.20.9
        with:
          image: practiceflow-frontend:${{ github.sha }}
          format: spdx-json
          syft-version: v1.51.1
          output-file: artifacts/sbom/practiceflow-frontend.spdx.json
          upload-artifact: "false"

      - name: Scan backend image for High and Critical CVEs
        id: trivy_backend
        continue-on-error: true
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: practiceflow-backend:${{ github.sha }}
          format: json
          output: artifacts/trivy/practiceflow-backend.json
          severity: HIGH,CRITICAL
          exit-code: "1"
          version: v0.65.0
          scanners: vuln
          ignore-unfixed: "false"
          trivyignores: .trivyignore
          hide-progress: "true"

      - name: Scan frontend image for High and Critical CVEs
        id: trivy_frontend
        continue-on-error: true
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: practiceflow-frontend:${{ github.sha }}
          format: json
          output: artifacts/trivy/practiceflow-frontend.json
          severity: HIGH,CRITICAL
          exit-code: "1"
          version: v0.65.0
          scanners: vuln
          ignore-unfixed: "false"
          trivyignores: .trivyignore
          hide-progress: "true"

      - name: Upload SBOM and vulnerability scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-image-supply-chain-artifacts
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/sbom
            artifacts/trivy

      - name: Enforce High/Critical CVE gate
        if: always()
        env:
          BACKEND_SCAN: ${{ steps.trivy_backend.outcome }}
          FRONTEND_SCAN: ${{ steps.trivy_frontend.outcome }}
        run: |
          if [ "$BACKEND_SCAN" = "failure" ] || [ "$FRONTEND_SCAN" = "failure" ]; then
            echo "High or Critical CVEs found outside .trivyignore; see the uploaded Trivy report."
            exit 1
          fi
