name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation links and required runbooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify Markdown links and required production documents
        run: python3 scripts/verify_documentation.py

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        # postgres:16.15-alpine3.24
        image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: practiceflow_test
          POSTGRES_PASSWORD: practiceflow_test_ci_only
          POSTGRES_DB: practiceflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U practiceflow_test -d practiceflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres-migrations:
        # postgres:16.15-alpine3.24
        image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: practiceflow_test
          POSTGRES_PASSWORD: practiceflow_test_ci_only
          POSTGRES_DB: practiceflow_migration_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U practiceflow_test -d practiceflow_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      ENV: test
      DATABASE_URL: postgresql+psycopg://practiceflow_test:practiceflow_test_ci_only@localhost:5432/practiceflow_ci_unused
      TEST_DATABASE_URL: postgresql+psycopg://practiceflow_test:practiceflow_test_ci_only@localhost:5432/practiceflow_test
      JWT_SECRET_KEY: ci-only-secret-that-is-never-used-in-production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app seed.py e2e_seed.py
      - name: Type check security and operations layers
        run: mypy app/core app/rate_limit app/observability app/middleware.py app/api/pagination.py
      - name: Migrations and schema drift
        run: |
          DATABASE_URL="postgresql+psycopg://practiceflow_test:practiceflow_test_ci_only@localhost:5433/practiceflow_migration_test" alembic upgrade head
          DATABASE_URL="postgresql+psycopg://practiceflow_test:practiceflow_test_ci_only@localhost:5433/practiceflow_migration_test" alembic check
      - name: Backend tests
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/tests"
          pytest app/tests -q --junitxml="$GITHUB_WORKSPACE/artifacts/tests/backend-junit.xml"
      - name: Python dependency audit
        run: pip-audit -r requirements.txt
      - name: Capacity configuration policy
        run: python ../scripts/verify_capacity_configuration.py
      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-test-report
          if-no-files-found: warn
          path: artifacts/tests/backend-junit.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Frontend tests
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/tests"
          npm test -- --reporter=junit --outputFile="$GITHUB_WORKSPACE/artifacts/tests/frontend-junit.xml"
      - run: npm run build
      - name: npm dependency audit
        run: npm audit --audit-level=high
      - name: Upload frontend test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-test-report
          if-no-files-found: warn
          path: artifacts/tests/frontend-junit.xml

  e2e:
    name: E2E integration
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      COMPOSE_PROJECT_NAME: practiceflow-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Playwright test runner
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start isolated production E2E stack
        working-directory: .
        run: docker compose --project-name "$COMPOSE_PROJECT_NAME" -f docker-compose.e2e.yml up --build --wait
      - name: Verify Nginx frontend endpoint
        working-directory: .
        run: curl --fail --retry 5 --retry-all-errors http://127.0.0.1:4173/healthz
      - name: Verify private MinIO object storage round trip and cleanup
        working-directory: .
        run: >-
          docker compose --project-name "$COMPOSE_PROJECT_NAME" -f docker-compose.e2e.yml run --rm --no-deps
          --entrypoint pytest -e S3_MINIO_INTEGRATION=1 -e PYTHONPATH=/app
          backend app/s3_integration_tests -q -p no:cacheprovider
      - name: Run Playwright regression gate
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npm run test:e2e
      - name: Save Playwright traces, screenshots, videos and HTML report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-failure-artifacts
          if-no-files-found: warn
          path: |
            frontend/test-results
            frontend/playwright-report
      - name: Save E2E container status without application logs
        if: failure()
        working-directory: .
        run: docker compose --project-name "$COMPOSE_PROJECT_NAME" -f docker-compose.e2e.yml ps --format json
      - name: Stop isolated E2E stack
        if: always()
        working-directory: .
        run: docker compose --project-name "$COMPOSE_PROJECT_NAME" -f docker-compose.e2e.yml down --volumes --remove-orphans

  compose-isolation:
    name: Disposable Compose project isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify unique project labels and owned cleanup
        run: python scripts/verify_compose_project_isolation.py
