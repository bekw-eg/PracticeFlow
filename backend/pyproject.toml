[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy resolves string relationship annotations after all models are
# registered in app.models; they intentionally are not runtime imports.
"app/models/*.py" = ["F821"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_untyped_imports = true
disable_error_code = ["import-untyped"]
