services:
  caddy:
    # caddy:2.10.2-alpine
    image: caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      PRACTICEFLOW_DOMAIN: ${PRACTICEFLOW_DOMAIN:?PRACTICEFLOW_DOMAIN is required}
      CADDY_EMAIL: ${CADDY_EMAIL:?CADDY_EMAIL is required}
      METRICS_ALLOWED_CIDR: ${METRICS_ALLOWED_CIDR:?METRICS_ALLOWED_CIDR is required}
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    volumes:
      - ./deployment/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        ipv4_address: ${CADDY_PROXY_IP:?CADDY_PROXY_IP is required}
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }
        reservations: { cpus: "0.10", memory: 64M }

volumes:
  caddy_data:
  caddy_config:
