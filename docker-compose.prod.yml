services:
  postgres:
    # postgres:16.15-alpine3.24
    image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:?POSTGRES_MAX_CONNECTIONS is required}"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 1G }
        reservations: { cpus: "0.50", memory: 512M }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 20

  redis:
    # redis:7-alpine
    image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    # Security-critical rate-limit, quota, lease and queue keys must never be
    # evicted. On exhaustion Redis returns an error and the application fails closed.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }
        reservations: { cpus: "0.25", memory: 128M }
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:?DATABASE_POOL_SIZE is required}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:?DATABASE_MAX_OVERFLOW is required}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:?DATABASE_POOL_TIMEOUT_SECONDS is required}
      DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:?DATABASE_POOL_RECYCLE_SECONDS is required}
      WORKER_DATABASE_POOL_SIZE: ${WORKER_DATABASE_POOL_SIZE:?WORKER_DATABASE_POOL_SIZE is required}
      WORKER_DATABASE_MAX_OVERFLOW: ${WORKER_DATABASE_MAX_OVERFLOW:?WORKER_DATABASE_MAX_OVERFLOW is required}
      WORKER_DATABASE_POOL_TIMEOUT_SECONDS: ${WORKER_DATABASE_POOL_TIMEOUT_SECONDS:?WORKER_DATABASE_POOL_TIMEOUT_SECONDS is required}
      WORKER_DATABASE_POOL_RECYCLE_SECONDS: ${WORKER_DATABASE_POOL_RECYCLE_SECONDS:?WORKER_DATABASE_POOL_RECYCLE_SECONDS is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      MFA_TOTP_ENCRYPTION_KEY: ${MFA_TOTP_ENCRYPTION_KEY:?MFA_TOTP_ENCRYPTION_KEY is required}
      MFA_RECOVERY_CODE_PEPPER: ${MFA_RECOVERY_CODE_PEPPER:?MFA_RECOVERY_CODE_PEPPER is required}
      MFA_BREAK_GLASS_KEY_A_HASH: ${MFA_BREAK_GLASS_KEY_A_HASH:?MFA_BREAK_GLASS_KEY_A_HASH is required}
      MFA_BREAK_GLASS_KEY_B_HASH: ${MFA_BREAK_GLASS_KEY_B_HASH:?MFA_BREAK_GLASS_KEY_B_HASH is required}
      AUDIT_HASH_PEPPER: ${AUDIT_HASH_PEPPER:?AUDIT_HASH_PEPPER is required}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:?AUDIT_RETENTION_DAYS is required}
      AUDIT_CLEANUP_INTERVAL_SECONDS: ${AUDIT_CLEANUP_INTERVAL_SECONDS:?AUDIT_CLEANUP_INTERVAL_SECONDS is required}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      SEED_ON_START: "false"
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      LOGIN_RATE_LIMIT_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      RESOURCE_GUARD_BACKEND: redis
      EXPORT_QUEUE_BACKEND: redis
      UPLOAD_MAX_FILE_BYTES: ${UPLOAD_MAX_FILE_BYTES:?UPLOAD_MAX_FILE_BYTES is required}
      UPLOAD_RATE_LIMIT_REQUESTS: ${UPLOAD_RATE_LIMIT_REQUESTS:?UPLOAD_RATE_LIMIT_REQUESTS is required}
      UPLOAD_RATE_LIMIT_WINDOW_SECONDS: ${UPLOAD_RATE_LIMIT_WINDOW_SECONDS:?UPLOAD_RATE_LIMIT_WINDOW_SECONDS is required}
      UPLOAD_USER_MAX_FILES: ${UPLOAD_USER_MAX_FILES:?UPLOAD_USER_MAX_FILES is required}
      UPLOAD_USER_MAX_BYTES: ${UPLOAD_USER_MAX_BYTES:?UPLOAD_USER_MAX_BYTES is required}
      UPLOAD_USER_QUOTA_WINDOW_SECONDS: ${UPLOAD_USER_QUOTA_WINDOW_SECONDS:?UPLOAD_USER_QUOTA_WINDOW_SECONDS is required}
      UPLOAD_ORGANIZATION_MAX_STORAGE_BYTES: ${UPLOAD_ORGANIZATION_MAX_STORAGE_BYTES:?UPLOAD_ORGANIZATION_MAX_STORAGE_BYTES is required}
      UPLOAD_RESERVATION_TTL_SECONDS: ${UPLOAD_RESERVATION_TTL_SECONDS:?UPLOAD_RESERVATION_TTL_SECONDS is required}
      UPLOAD_QUOTA_RETRY_AFTER_SECONDS: ${UPLOAD_QUOTA_RETRY_AFTER_SECONDS:?UPLOAD_QUOTA_RETRY_AFTER_SECONDS is required}
      EXPORT_USER_RATE_LIMIT_REQUESTS: ${EXPORT_USER_RATE_LIMIT_REQUESTS:?EXPORT_USER_RATE_LIMIT_REQUESTS is required}
      EXPORT_ORGANIZATION_RATE_LIMIT_REQUESTS: ${EXPORT_ORGANIZATION_RATE_LIMIT_REQUESTS:?EXPORT_ORGANIZATION_RATE_LIMIT_REQUESTS is required}
      EXPORT_RATE_LIMIT_WINDOW_SECONDS: ${EXPORT_RATE_LIMIT_WINDOW_SECONDS:?EXPORT_RATE_LIMIT_WINDOW_SECONDS is required}
      EXPORT_MAX_CONCURRENT_PER_USER: ${EXPORT_MAX_CONCURRENT_PER_USER:?EXPORT_MAX_CONCURRENT_PER_USER is required}
      EXPORT_MAX_CONCURRENT_PER_ORGANIZATION: ${EXPORT_MAX_CONCURRENT_PER_ORGANIZATION:?EXPORT_MAX_CONCURRENT_PER_ORGANIZATION is required}
      EXPORT_TIMEOUT_SECONDS: ${EXPORT_TIMEOUT_SECONDS:?EXPORT_TIMEOUT_SECONDS is required}
      EXPORT_JOB_RETENTION_SECONDS: ${EXPORT_JOB_RETENTION_SECONDS:?EXPORT_JOB_RETENTION_SECONDS is required}
      EXPORT_WORKER_LEASE_SECONDS: ${EXPORT_WORKER_LEASE_SECONDS:?EXPORT_WORKER_LEASE_SECONDS is required}
      EXPORT_WORKER_HARD_TIMEOUT_SECONDS: ${EXPORT_WORKER_HARD_TIMEOUT_SECONDS:?EXPORT_WORKER_HARD_TIMEOUT_SECONDS is required}
      EXPORT_WORKER_QUEUE_TIMEOUT_SECONDS: ${EXPORT_WORKER_QUEUE_TIMEOUT_SECONDS:?EXPORT_WORKER_QUEUE_TIMEOUT_SECONDS is required}
      EXPORT_WORKER_REQUEUE_DELAY_SECONDS: ${EXPORT_WORKER_REQUEUE_DELAY_SECONDS:?EXPORT_WORKER_REQUEUE_DELAY_SECONDS is required}
      EXPORT_WORKER_HEARTBEAT_INTERVAL_SECONDS: ${EXPORT_WORKER_HEARTBEAT_INTERVAL_SECONDS:?EXPORT_WORKER_HEARTBEAT_INTERVAL_SECONDS is required}
      EXPORT_WORKER_HEARTBEAT_TTL_SECONDS: ${EXPORT_WORKER_HEARTBEAT_TTL_SECONDS:?EXPORT_WORKER_HEARTBEAT_TTL_SECONDS is required}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:?TRUSTED_PROXY_IPS is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?S3_ENDPOINT_URL is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_REGION: ${S3_REGION:?S3_REGION is required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:?S3_ADDRESSING_STYLE is required}
      S3_VERIFY_TLS: "true"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@practiceflow.invalid}
    deploy:
      resources:
        limits: { cpus: "0.75", memory: 768M }
        reservations: { cpus: "0.25", memory: 384M }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  export-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # A worker requeues its claim on SIGTERM; this exceeds the renderer's
    # 45-second hard timeout and gives Postgres/Redis time to remain reachable.
    stop_grace_period: 90s
    command: ["python", "-m", "app.workers.export_worker"]
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:?DATABASE_POOL_SIZE is required}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:?DATABASE_MAX_OVERFLOW is required}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:?DATABASE_POOL_TIMEOUT_SECONDS is required}
      DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:?DATABASE_POOL_RECYCLE_SECONDS is required}
      WORKER_DATABASE_POOL_SIZE: ${WORKER_DATABASE_POOL_SIZE:?WORKER_DATABASE_POOL_SIZE is required}
      WORKER_DATABASE_MAX_OVERFLOW: ${WORKER_DATABASE_MAX_OVERFLOW:?WORKER_DATABASE_MAX_OVERFLOW is required}
      WORKER_DATABASE_POOL_TIMEOUT_SECONDS: ${WORKER_DATABASE_POOL_TIMEOUT_SECONDS:?WORKER_DATABASE_POOL_TIMEOUT_SECONDS is required}
      WORKER_DATABASE_POOL_RECYCLE_SECONDS: ${WORKER_DATABASE_POOL_RECYCLE_SECONDS:?WORKER_DATABASE_POOL_RECYCLE_SECONDS is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      MFA_TOTP_ENCRYPTION_KEY: ${MFA_TOTP_ENCRYPTION_KEY:?MFA_TOTP_ENCRYPTION_KEY is required}
      MFA_RECOVERY_CODE_PEPPER: ${MFA_RECOVERY_CODE_PEPPER:?MFA_RECOVERY_CODE_PEPPER is required}
      MFA_BREAK_GLASS_KEY_A_HASH: ${MFA_BREAK_GLASS_KEY_A_HASH:?MFA_BREAK_GLASS_KEY_A_HASH is required}
      MFA_BREAK_GLASS_KEY_B_HASH: ${MFA_BREAK_GLASS_KEY_B_HASH:?MFA_BREAK_GLASS_KEY_B_HASH is required}
      AUDIT_HASH_PEPPER: ${AUDIT_HASH_PEPPER:?AUDIT_HASH_PEPPER is required}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:?AUDIT_RETENTION_DAYS is required}
      AUDIT_CLEANUP_INTERVAL_SECONDS: ${AUDIT_CLEANUP_INTERVAL_SECONDS:?AUDIT_CLEANUP_INTERVAL_SECONDS is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      SEED_ON_START: "false"
      COOKIE_SECURE: "true"
      LOGIN_RATE_LIMIT_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      RESOURCE_GUARD_BACKEND: redis
      EXPORT_QUEUE_BACKEND: redis
      UPLOAD_MAX_FILE_BYTES: ${UPLOAD_MAX_FILE_BYTES:?UPLOAD_MAX_FILE_BYTES is required}
      UPLOAD_RATE_LIMIT_REQUESTS: ${UPLOAD_RATE_LIMIT_REQUESTS:?UPLOAD_RATE_LIMIT_REQUESTS is required}
      UPLOAD_RATE_LIMIT_WINDOW_SECONDS: ${UPLOAD_RATE_LIMIT_WINDOW_SECONDS:?UPLOAD_RATE_LIMIT_WINDOW_SECONDS is required}
      UPLOAD_USER_MAX_FILES: ${UPLOAD_USER_MAX_FILES:?UPLOAD_USER_MAX_FILES is required}
      UPLOAD_USER_MAX_BYTES: ${UPLOAD_USER_MAX_BYTES:?UPLOAD_USER_MAX_BYTES is required}
      UPLOAD_USER_QUOTA_WINDOW_SECONDS: ${UPLOAD_USER_QUOTA_WINDOW_SECONDS:?UPLOAD_USER_QUOTA_WINDOW_SECONDS is required}
      UPLOAD_ORGANIZATION_MAX_STORAGE_BYTES: ${UPLOAD_ORGANIZATION_MAX_STORAGE_BYTES:?UPLOAD_ORGANIZATION_MAX_STORAGE_BYTES is required}
      UPLOAD_RESERVATION_TTL_SECONDS: ${UPLOAD_RESERVATION_TTL_SECONDS:?UPLOAD_RESERVATION_TTL_SECONDS is required}
      UPLOAD_QUOTA_RETRY_AFTER_SECONDS: ${UPLOAD_QUOTA_RETRY_AFTER_SECONDS:?UPLOAD_QUOTA_RETRY_AFTER_SECONDS is required}
      EXPORT_USER_RATE_LIMIT_REQUESTS: ${EXPORT_USER_RATE_LIMIT_REQUESTS:?EXPORT_USER_RATE_LIMIT_REQUESTS is required}
      EXPORT_ORGANIZATION_RATE_LIMIT_REQUESTS: ${EXPORT_ORGANIZATION_RATE_LIMIT_REQUESTS:?EXPORT_ORGANIZATION_RATE_LIMIT_REQUESTS is required}
      EXPORT_RATE_LIMIT_WINDOW_SECONDS: ${EXPORT_RATE_LIMIT_WINDOW_SECONDS:?EXPORT_RATE_LIMIT_WINDOW_SECONDS is required}
      EXPORT_MAX_CONCURRENT_PER_USER: ${EXPORT_MAX_CONCURRENT_PER_USER:?EXPORT_MAX_CONCURRENT_PER_USER is required}
      EXPORT_MAX_CONCURRENT_PER_ORGANIZATION: ${EXPORT_MAX_CONCURRENT_PER_ORGANIZATION:?EXPORT_MAX_CONCURRENT_PER_ORGANIZATION is required}
      EXPORT_TIMEOUT_SECONDS: ${EXPORT_TIMEOUT_SECONDS:?EXPORT_TIMEOUT_SECONDS is required}
      EXPORT_JOB_RETENTION_SECONDS: ${EXPORT_JOB_RETENTION_SECONDS:?EXPORT_JOB_RETENTION_SECONDS is required}
      EXPORT_WORKER_LEASE_SECONDS: ${EXPORT_WORKER_LEASE_SECONDS:?EXPORT_WORKER_LEASE_SECONDS is required}
      EXPORT_WORKER_HARD_TIMEOUT_SECONDS: ${EXPORT_WORKER_HARD_TIMEOUT_SECONDS:?EXPORT_WORKER_HARD_TIMEOUT_SECONDS is required}
      EXPORT_WORKER_QUEUE_TIMEOUT_SECONDS: ${EXPORT_WORKER_QUEUE_TIMEOUT_SECONDS:?EXPORT_WORKER_QUEUE_TIMEOUT_SECONDS is required}
      EXPORT_WORKER_REQUEUE_DELAY_SECONDS: ${EXPORT_WORKER_REQUEUE_DELAY_SECONDS:?EXPORT_WORKER_REQUEUE_DELAY_SECONDS is required}
      EXPORT_WORKER_HEARTBEAT_INTERVAL_SECONDS: ${EXPORT_WORKER_HEARTBEAT_INTERVAL_SECONDS:?EXPORT_WORKER_HEARTBEAT_INTERVAL_SECONDS is required}
      EXPORT_WORKER_HEARTBEAT_TTL_SECONDS: ${EXPORT_WORKER_HEARTBEAT_TTL_SECONDS:?EXPORT_WORKER_HEARTBEAT_TTL_SECONDS is required}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:?TRUSTED_PROXY_IPS is required}
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?S3_ENDPOINT_URL is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_REGION: ${S3_REGION:?S3_REGION is required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:?S3_ADDRESSING_STYLE is required}
      S3_VERIFY_TLS: "true"
      RUN_MIGRATIONS: "false"
      RUN_SEED: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 1G }
        reservations: { cpus: "0.50", memory: 512M }
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.export_worker", "--check"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      default:
        ipv4_address: ${FRONTEND_PROXY_IP:?FRONTEND_PROXY_IP is required}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }
        reservations: { cpus: "0.10", memory: 64M }

volumes:
  postgres_data:

networks:
  default:
    name: ${APP_NETWORK_NAME:?APP_NETWORK_NAME is required}
    driver: bridge
    ipam:
      config:
        - subnet: ${APP_NETWORK_SUBNET:?APP_NETWORK_SUBNET is required}
