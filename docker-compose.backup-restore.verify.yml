# Disposable integration environment used only by scripts/verify-backup-restore.py.
# Run it through distinct Compose project names so source and restore volumes are
# never shared. It deliberately exposes only the backend on loopback.
services:
  postgres:
    # postgres:16.15-alpine3.24
    image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: practiceflow_verify
      POSTGRES_PASSWORD: practiceflow_verify_local_only
      POSTGRES_DB: practiceflow_verify
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U practiceflow_verify -d practiceflow_verify"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENV: development
      DATABASE_URL: postgresql+psycopg://practiceflow_verify:practiceflow_verify_local_only@postgres:5432/practiceflow_verify
      JWT_SECRET_KEY: backup-restore-verification-secret-not-for-production
      CORS_ORIGINS: '["http://localhost"]'
      SEED_ON_START: ${SEED_ON_START:-true}
      FRONTEND_URL: http://localhost
      STORAGE_LOCAL_PATH: /app/storage_data
    ports:
      - "127.0.0.1:${BACKUP_VERIFY_BACKEND_PORT:-18080}:8000"
    volumes:
      - backend_storage:/app/storage_data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
  backend_storage:
